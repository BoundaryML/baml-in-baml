[upstream]
remote = "upstream"
branch = "canary"
repo = "BoundaryML/baml"

[fork]
branch = "main"
repo = "BoundaryML/baml-in-baml"
push = true            # push main to origin after each sync run

[sync]
max_commits_per_run = 50

[ports]
# Write the Intent section of each pending port (reads the upstream PR, writes no code).
intent_enabled = true
# Frontend layers whose BAML version passes its phase gate (bib/MIGRATION.md).
# Port tasks that touch only unported layers are recorded as `absorbed`.
# Layers: parse, ast, hir, tir, mir, emit, codegen, diag.
ported_layers = ["parse", "ast", "hir", "tir", "diag"]
# Re-build pending ports in the BAML frontend. Off until the BAML frontend is bootstrapped.
port_enabled = false
