# Classifies upstream paths. First matching rule wins; unmatched paths are "mirror".
#
#   frontend  source text -> MIR. Changes here need a BAML port.
#   spec      tests and fixtures that pin frontend behavior. Mirrored; when they
#             change alongside frontend code they are the port's acceptance tests.
#   shared    used by both frontend and runtime. Mirrored; listed in the port task
#             so the port agent checks whether the BAML frontend must follow.
#   mirror    everything else (runtime, emit, VM, SDKs, docs, website, CI).
#
# Globs are fnmatch-style against repo-relative paths.

# Frontend rules also carry a `layer` (see bib/MIGRATION.md, "How upstream PRs flow").

[[rule]]
class = "frontend"
layer = "parse"
globs = [
  "baml_language/crates/baml_syntax/**",
  "baml_language/crates/baml_syntax_macros/**",
  "baml_language/crates/baml_parser/**",
]

[[rule]]
class = "frontend"
layer = "ast"
globs = ["baml_language/crates/baml_compiler2_ast/**"]

[[rule]]
class = "frontend"
layer = "hir"
globs = ["baml_language/crates/baml_compiler2_hir/**"]

[[rule]]
class = "frontend"
layer = "tir"
globs = ["baml_language/crates/baml_compiler2_hir_ty/**"]

[[rule]]
class = "frontend"
layer = "mir"
globs = ["baml_language/crates/baml_compiler2_mir/**"]

[[rule]]
class = "frontend"
layer = "diag"
globs = ["baml_language/crates/baml_compiler_diagnostics/**"]

[[rule]]
class = "frontend"
layer = "emit"
globs = ["baml_language/crates/baml_compiler2_emit/**"]

[[rule]]
class = "frontend"
layer = "codegen"
globs = [
  "baml_language/crates/baml_sdkgen_types/**",
  "baml_language/crates/baml_cli/src/generate.rs",
  "baml_language/crates/baml_cli/src/generate/**",
]

[[rule]]
class = "spec"
globs = [
  "baml_language/crates/baml_tests/**",
  "baml_language/ARCHITECTURE.md",
  "baml_language/TYPE_SYSTEM.md",
]

[[rule]]
class = "shared"
globs = [
  "baml_language/crates/baml_base/**",
  "baml_language/crates/baml_type/**",
  "baml_language/crates/baml_type_macros/**",
  "baml_language/crates/baml_type_runtime/**",
  "baml_language/crates/baml_builtins2/**",
  "baml_language/crates/baml_builtins2_codegen/**",
  "baml_language/crates/baml_db/**",
  "baml_language/crates/baml_compiler2_rust/**",
  "baml_language/crates/baml_linker/**",
  "baml_language/crates/baml_linker_types/**",
]
